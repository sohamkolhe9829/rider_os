name: rider_os
description: "RiderOS — Production-grade motorcycle ride companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # GPS & Location
  geolocator: ^13.0.2

  # Sensors
  sensors_plus: ^6.1.1

  # Compass
  flutter_compass: ^0.8.1

  # Permissions
  permission_handler: ^12.0.3

  # Connectivity
  connectivity_plus: ^6.1.1
  flutter_local_notifications: ^22.1.0
  audioplayers: ^6.0.0
  url_launcher: ^6.3.2
  torch_light: ^2.0.0
  animated_flip_counter: ^0.3.4
  battery_plus: ^7.1.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/rideros_logo.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
